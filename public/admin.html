<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding RSVP — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg-page: #FAF7F2; --accent: #8B6914; }
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-page);
    }
  </style>
</head>
<body class="min-h-screen py-10 px-5">
  <div class="max-w-[800px] mx-auto">
    <h1 class="font-serif text-3xl mb-2">Wedding RSVP — Admin Dashboard</h1>
    <p class="text-sm text-gray-500 mb-8">Dimal Joseph & Soniya</p>
    
    <button onclick="fetchData()" class="float-right px-5 py-2.5 bg-[#8B6914] text-white border-none rounded-lg text-xs font-medium uppercase tracking-widest cursor-pointer hover:bg-[#C9A84C]">Refresh</button>

    <div class="grid grid-cols-3 gap-4 mb-8">
      <div class="bg-[#FFFDF8] border border-[#E8D9B5] rounded-xl shadow-sm p-5 text-center">
        <div class="font-serif text-4xl text-[#8B6914] mb-1" id="total-rsvps">—</div>
        <div class="text-[10px] uppercase tracking-widest text-gray-500">Total RSVPs</div>
      </div>
      <div class="bg-[#FFFDF8] border border-[#E8D9B5] rounded-xl shadow-sm p-5 text-center">
        <div class="font-serif text-4xl text-[#8B6914] mb-1" id="total-guests">—</div>
        <div class="text-[10px] uppercase tracking-widest text-gray-500">Guests Attending</div>
      </div>
      <div class="bg-[#FFFDF8] border border-[#E8D9B5] rounded-xl shadow-sm p-5 text-center">
        <div class="font-serif text-4xl text-[#8B6914] mb-1" id="declined">—</div>
        <div class="text-[10px] uppercase tracking-widest text-gray-500">Declined</div>
      </div>
    </div>

    <table class="w-full bg-[#FFFDF8] border border-[#E8D9B5] rounded-xl overflow-hidden shadow-sm">
      <thead>
        <tr class="bg-gray-50">
          <th class="p-3.5 text-left text-[10px] uppercase tracking-widest text-gray-500 border-b border-[#E8D9B5]">#</th>
          <th class="p-3.5 text-left text-[10px] uppercase tracking-widest text-gray-500 border-b border-[#E8D9B5]">Guest Name</th>
          <th class="p-3.5 text-left text-[10px] uppercase tracking-widest text-gray-500 border-b border-[#E8D9B5]">Attending</th>
          <th class="p-3.5 text-left text-[10px] uppercase tracking-widest text-gray-500 border-b border-[#E8D9B5]">Family Count</th>
          <th class="p-3.5 text-left text-[10px] uppercase tracking-widest text-gray-500 border-b border-[#E8D9B5]">Submitted At</th>
        </tr>
      </thead>
      <tbody id="rsvp-table" class="text-sm">
        <tr>
          <td colspan="5" class="p-10 text-center text-gray-500">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUbjv3o2urj8UdKqLlQVAB8KjWt539dWFAbyZDCm7MOFvM9K8hrxVkl3mGQ8wZ0ucxQg/exec";
    const SECRET_KEY = "wedding2026";

    async function fetchData() {
      const tableBody = document.getElementById('rsvp-table');
      tableBody.innerHTML = '<tr><td colspan="5" class="p-10 text-center text-gray-500">Loading...</td></tr>';

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?key=${SECRET_KEY}`);
        const data = await response.json();

        document.getElementById('total-rsvps').textContent = data.totalAttending + data.totalGuests;
        document.getElementById('total-guests').textContent = data.totalGuests;
        document.getElementById('declined').textContent = data.rsvps.filter(r => !r.attending).length;

        if (data.rsvps.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="5" class="p-10 text-center text-gray-500">No RSVPs yet</td></tr>';
          return;
        }

        tableBody.innerHTML = data.rsvps.map((r, i) => `
          <tr class="${r.attending ? 'border-l-4 border-[#8B6914]' : 'border-l-4 border-red-300'}">
            <td class="p-3.5 border-b border-[#E8D9B5]">${i + 1}</td>
            <td class="p-3.5 border-b border-[#E8D9B5]">${r.guestName}</td>
            <td class="p-3.5 border-b border-[#E8D9B5] ${r.attending ? 'text-[#8B6914]' : 'text-red-500'}">${r.attending ? 'Yes' : 'No'}</td>
            <td class="p-3.5 border-b border-[#E8D9B5]">${r.attending ? r.familyCount : '—'}</td>
            <td class="p-3.5 border-b border-[#E8D9B5]">${new Date(r.submittedAt).toLocaleString()}</td>
          </tr>
        `).join('');
      } catch (error) {
        tableBody.innerHTML = '<tr><td colspan="5" class="p-10 text-center text-red-500">Error loading data</td></tr>';
      }
    }

    fetchData();
  </script>
</body>
</html>
